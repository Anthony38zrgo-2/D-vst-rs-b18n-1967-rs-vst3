[workspace]
resolver = "2"
members = [
  "crates/b18n-dsp",
  "crates/b18n-config",
  "crates/b18n-plugin",
  "crates/b18n-render",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.95"

[workspace.dependencies]
b18n-dsp = { path = "crates/b18n-dsp" }
b18n-config = { path = "crates/b18n-config" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
