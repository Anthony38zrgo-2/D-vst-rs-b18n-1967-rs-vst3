[package]
name = "b18n-plugin"
description = "Adaptador VST3 (NIH-plug) del B-18N/B-15ND 1967"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["vst3"]
vst3 = ["nih_plug/vst3"]

[dependencies]
b18n-config.workspace = true
b18n-dsp.workspace = true
nih_plug.workspace = true
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
